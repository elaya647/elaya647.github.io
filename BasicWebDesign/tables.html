<!DOCTYPE html>
<html>
  <head>
    <title>Table Assignment</title>
  </head>

  <body>
    <h1>Favorite Drinks</h1>

    <table border="1">
      <caption>Favorite Drinks Comparison</caption>

      <tr>
        <th>Drink</th>
        <th>Price</th>
        <th>Rating</th>
      </tr>

      <tr>
        <td>Coffee</td>
        <td>$4</td>
        <td>9/10</td>
      </tr>

      <tr>
        <td>Tea</td>
        <td>$3</td>
        <td>8/10</td>
      </tr>

      <tr>
        <td colspan="2">Hot Chocolate</td>
        <td>10/10</td>
      </tr>

    </table>

    <h2> Conclusions</h2>

    <ul>
      <li>Coffee is the most expensive drink.</li>
      <li>Hot chocolate has the highest rating.</li>
      <li>Tea is the cheapest drink.</li>
    </ul>
    
  </body>
</html>
